<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X光室求生記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: 資深放射師帶新人值班：忙、亂、要同時顧好幾件事，但每個決定都有道理可講
IDEA: 放射科看片燈箱機殼裡的像素攝影室，門口有「X光使用中」紅燈
PICTURE: 俯視像素地圖：操作室、鉛玻璃、檢查台、立式攝影架、走廊候診椅與更衣間
COLOUR and TYPE: 燈箱深藍黑、底片青 #7fd3e6、警示紅 #e5483a；霞鶩文楷做對話，Noto Sans TC 做介面
LAYOUT: 寬螢幕左地圖右面板（狀態／待辦／互動）；1000px 以下上下堆疊
*/
:root{color-scheme:dark;--bg:#0a1720;--panel:#11263a;--p2:#173149;--ink:#e8f3f6;--mute:#9db7c2;--film:#7fd3e6;--red:#e5483a;--ok:#6fd49a;--warn:#f2b44c;--line:#24435b}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.wk{font-family:"LXGW WenKai TC","Noto Sans TC",serif}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
.app{max-width:1320px;margin:0 auto;padding:clamp(12px,2vw,24px) max(3vw,10px) 32px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.lamp{flex:none;padding:3px 10px;border-radius:4px;border:2px solid #5a2a26;color:#7a3a35;font:700 13px "Noto Sans TC";transition:.3s}
.lamp.on{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 0 18px var(--red)}
.top h1{font-size:clamp(24px,3.2vw,36px)}
.top p{margin:0;color:var(--mute);font-size:13px}
.game{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start;position:relative}
.box{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:10px;box-shadow:4px 4px 0 #050d13}
.screen{position:relative;border-radius:3px;overflow:hidden;background:#05101a;aspect-ratio:20/13}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:manipulation;cursor:pointer}
.toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:#000d;color:#fff;padding:5px 14px;border-radius:4px;font-size:14px;pointer-events:none;opacity:0;transition:opacity .3s;max-width:92%;text-align:center}
.toast.show{opacity:1}
.toast.bad{background:#7a1d14ee}
.hint{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:13px;margin-top:8px}
kbd{background:var(--p2);border:1px solid var(--line);border-radius:3px;padding:0 5px;font:12px monospace;color:var(--ink)}
.side{display:grid;gap:12px}
.hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 12px;font-size:13px}
.hud b{display:block;font-size:17px;color:var(--film);font-variant-numeric:tabular-nums}
.hud .full{grid-column:1/-1}
.bar{height:8px;background:var(--p2);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--film);transition:width .5s}
.todo{font-size:14px;display:grid;gap:4px}
.todo h3{font-size:16px;margin-bottom:2px}
.tk{display:flex;gap:8px;align-items:baseline}
.tk>span:first-child{flex:none;width:1.2em;text-align:center}
.tk.done{color:var(--mute)}
.tk.now{color:var(--warn)}
.al{display:flex;justify-content:space-between;gap:8px;padding:4px 8px;border-radius:3px;background:var(--p2);font-size:13px}
.al.hot{background:#4a1b16;color:#ffd3cc;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{background:#6b241c}}
@media(prefers-reduced-motion:reduce){.al.hot{animation:none}}
.al b{white-space:nowrap;font-variant-numeric:tabular-nums}
.ticket{border:1px dashed var(--film);border-radius:3px;padding:6px 10px;font-size:13px;margin:4px 0;background:#0d2232}
.ticket b{color:var(--film)}
.act{min-height:200px}
.acts{display:grid;gap:6px}
.ab{display:flex;gap:10px;align-items:center;text-align:start;width:100%;min-height:44px;padding:8px 12px;border-radius:4px;border:2px solid var(--film);background:#0d2232;color:var(--ink);font:500 15px "Noto Sans TC";cursor:pointer;box-shadow:3px 3px 0 #050d13}
.ab:hover{background:var(--p2)}
.ab kbd{flex:none}
.idle{color:var(--mute);font-size:14px;margin:0}
.who{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.pf{flex:none;width:64px;height:64px;image-rendering:pixelated;border:2px solid var(--line);border-radius:3px;background:var(--p2)}
.who h3{font-size:19px}
.who small{display:block;color:var(--mute);font-size:12px}
.kind{margin-left:auto;flex:none;font-size:12px;padding:2px 8px;border-radius:3px;background:var(--p2);color:var(--film)}
.kind.ph{background:#3d2f0f;color:var(--warn)}.kind.cr{background:#2f1f3d;color:#d7b8ff}.kind.nb{background:#1f3a1f;color:#a8e6a3}.kind.rs{background:#0f3340;color:var(--film)}
.sit{color:var(--mute);font-size:14px;margin:0 0 6px}
.say{font-family:"LXGW WenKai TC",serif;font-size:18px;line-height:1.5;background:var(--p2);border-radius:2px 10px 10px 10px;padding:8px 12px;margin:0 0 10px}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;text-align:start;width:100%;min-height:44px;padding:8px 10px;border-radius:4px;border:2px solid var(--line);background:transparent;color:var(--ink);font:14px/1.55 "Noto Sans TC";cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--film);background:var(--p2)}
.opt:focus-visible,.ab:focus-visible,.btn:focus-visible,.hb:focus-visible,.shift:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.opt kbd{flex:none;height:fit-content}
.opt:disabled{opacity:.4;cursor:default}
.opt.pick{opacity:1;border-color:var(--film);background:var(--p2)}
.opt.best{border-color:var(--warn)}
.opt.gone{text-decoration:line-through}
.hrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center;font-size:13px;color:var(--mute)}
.hb{min-height:36px;padding:4px 10px;border-radius:4px;border:1px solid var(--line);background:var(--p2);color:var(--ink);font:13px "Noto Sans TC";cursor:pointer}
.hb:disabled{opacity:.35;cursor:default}
.helpmsg{margin-top:8px;font-size:14px;background:#2a2410;border-left:3px solid var(--warn);padding:6px 10px}
.fb{margin-top:12px;padding-top:10px;border-top:2px dashed var(--line)}
.stamp{display:inline-block;font:700 17px "LXGW WenKai TC",serif;padding:1px 10px;border:2.5px solid currentColor;border-radius:4px;transform:rotate(-3deg);margin-bottom:6px}
.g3{color:var(--ok)}.g2{color:var(--film)}.g1{color:var(--warn)}.g0{color:var(--red)}
.fb p{margin:0 0 6px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.chips span{font-size:12px;padding:1px 8px;border-radius:3px;background:var(--p2);white-space:nowrap}
.up{color:var(--ok)}.dn{color:var(--red)}
.tip{font-family:"LXGW WenKai TC",serif;font-size:15px;color:var(--film);margin:6px 0 10px}
.rs{list-style:none;padding:0;margin:6px 0 10px;display:grid;gap:4px;font-size:14px}
.rs li{display:flex;gap:8px}
.rs li span:first-child{flex:none;width:1.2em}
.btn{min-height:44px;padding:8px 20px;border-radius:4px;border:0;background:var(--film);color:#0a1720;font:700 15px "Noto Sans TC";cursor:pointer;box-shadow:3px 3px 0 #050d13}
.btn.ghost{background:transparent;color:var(--film);border:2px solid var(--film)}
.cover{position:fixed;inset:0;z-index:30;background:#0a1720;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:clamp(14px,4vh,48px) 14px}
.cover[hidden]{display:none}
.cv{max-width:900px;width:100%}
.cv h2{font-size:clamp(26px,4vw,40px);margin-bottom:8px}
.cv>p{color:var(--mute);margin:0 0 14px;max-width:66ch}
.shifts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px;margin-bottom:16px}
.shift{text-align:start;background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:12px;color:var(--ink);font:inherit;cursor:pointer;box-shadow:3px 3px 0 #050d13}
.shift:hover{border-color:var(--film)}
.shift h3{font-size:21px;color:var(--film)}
.shift small{display:block;color:var(--mute);font-size:12px;margin:2px 0 6px}
.shift p{margin:0;font-size:13px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;margin:0 0 14px}
.flow span{background:var(--p2);padding:3px 9px;border-radius:3px}
.flow i{font-style:normal;color:var(--mute)}
.cast{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:8px;font-size:13px;color:var(--mute)}
.cast div{display:flex;gap:8px;align-items:center}
.cast img{width:40px;height:40px;image-rendering:pixelated;flex:none;border-radius:3px}
.cast b{color:var(--ink)}
.res{display:grid;gap:6px;margin:12px 0}
.res div{display:grid;grid-template-columns:6em minmax(0,1fr) 2.5em;gap:10px;align-items:center;font-size:14px}
.res b{text-align:right;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:8px;margin:12px 0}
.stats div{background:var(--panel);border:2px solid var(--line);padding:8px 10px;border-radius:4px;font-size:13px;color:var(--mute)}
.stats b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.big{font:700 clamp(44px,8vw,72px)/1 "LXGW WenKai TC",serif;color:var(--film)}
.log{list-style:none;padding:0;margin:8px 0;font-size:13px;columns:2 260px}
.log li{display:flex;gap:8px;padding:3px 0;break-inside:avoid}
.log li span:first-child{flex:none;width:3.4em;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.small{font-size:12px;color:var(--mute)}
@media(max-width:1000px){.game{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.say{font-size:16px}.box{padding:8px}.hud{grid-template-columns:repeat(2,minmax(0,1fr))}}

.goal{position:absolute;left:8px;top:8px;max-width:calc(100% - 16px);background:#0a1720e6;color:var(--warn);border:2px solid var(--warn);padding:4px 10px;border-radius:4px;font:700 14px "Noto Sans TC";pointer-events:none}
.goal[hidden],.float[hidden],.modal[hidden]{display:none}
.float{position:absolute;transform:translate(-50%,-100%);z-index:3;min-height:40px;padding:6px 14px;border-radius:4px;border:2px solid #0a1720;background:var(--warn);color:#0a1720;font:700 14px "Noto Sans TC";cursor:pointer;white-space:nowrap;box-shadow:3px 3px 0 #050d13}
.toast{top:auto;bottom:8px}
@media(max-width:700px){.toast{font-size:12px;padding:4px 10px;bottom:4px}}
.modal{position:fixed;inset:0;z-index:20;background:#05101ab3;overflow:auto;padding:clamp(10px,4vh,48px) 10px}
.card{max-width:640px;margin:0 auto;background:var(--panel);border:2px solid var(--film);border-radius:6px;padding:16px;box-shadow:6px 6px 0 #050d13}
button.al{width:100%;border:0;color:var(--ink);font:13px "Noto Sans TC";text-align:start;cursor:pointer;min-height:36px;align-items:center}
button.al:hover:not(:disabled){outline:2px solid var(--film)}
button.al:disabled{opacity:.55;cursor:default}
.todo h3 small{font:400 12px "Noto Sans TC";color:var(--mute);margin-left:6px}

.gbox{position:relative}
.gbox .goal{left:18px;top:18px;z-index:2}
@media(max-width:700px){
 .app{padding-bottom:96px}
 .top{margin-bottom:8px;gap:8px}.top h1{font-size:22px}.top p{display:none}
 .hint{display:none}
 .gbox .goal{position:static;display:block;margin:0 0 8px;font-size:15px;max-width:none}
 .float{position:fixed;left:50%!important;top:auto!important;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:17px;min-height:54px;padding:12px 22px;max-width:92vw;white-space:normal;text-align:center;z-index:15}
 .hud{grid-template-columns:repeat(4,minmax(0,1fr))!important}
 button.al{min-height:46px;font-size:15px}
 .card{padding:12px}.opt{font-size:15px;min-height:52px}
}
@media(max-width:700px){
 .cover{padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
 .cv{margin-block:auto}
 .cv h2{font-size:24px;margin-bottom:4px}
 .cv>p{font-size:13px;line-height:1.5;margin-bottom:8px}
 .flow{font-size:12px;gap:4px;margin-bottom:8px}.flow span{padding:2px 6px}
 .cv .how{display:none}
 .shifts{gap:6px;margin-bottom:8px}
 .shift{padding:8px 10px}.shift h3{font-size:18px;display:inline}.shift small{display:inline;margin-left:6px;font-size:11px}.shift p{font-size:12px;margin-top:2px}
 .cast{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;font-size:11px}.cast img{width:30px;height:30px}.cast div span{line-height:1.3}
}

.nick{display:flex;align-items:center;gap:10px;margin:6px 0 12px;font:700 15px "Noto Sans TC"}
.nick input{flex:1;max-width:280px;min-height:44px;padding:8px 12px;border-radius:4px;border:2px solid var(--film);background:#0d2232;color:var(--ink);font:16px "Noto Sans TC"}
.nick input.need{border-color:var(--red);box-shadow:0 0 0 3px #e5483a55}
.hq{border:2px solid var(--line);border-radius:6px;padding:10px 12px;margin:0 0 10px;display:flex;flex-wrap:wrap;gap:6px 14px}
.hq legend{padding:0 6px;font-weight:700;font-size:15px}
.hq label{display:flex;align-items:center;gap:6px;min-height:36px;font-size:15px;cursor:pointer}
.hq input{width:20px;height:20px;accent-color:var(--film)}
.hq .none{color:var(--warn)}
.upl{margin:8px 0;padding:8px 12px;border-radius:4px;background:var(--p2);font-size:14px}.upl.ok{color:var(--ok)}
.sub{font-size:18px;margin:14px 0 4px}
.lbl{list-style:none;padding:0;margin:6px 0;display:grid;gap:4px;max-width:420px}
.lbl li{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:8px;padding:6px 10px;background:var(--panel);border-radius:4px;font-size:15px}
.lbl li.me{outline:2px solid var(--warn)}
.lbl .sh{margin-left:8px;font-size:12px;padding:1px 6px;border-radius:3px;background:var(--p2);color:var(--mute)}
.lbl li b{color:var(--film);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;margin:8px 0}.tab{min-height:40px;padding:6px 14px;border-radius:4px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:15px "Noto Sans TC";cursor:pointer}.tab.on{border-color:var(--film);color:var(--film)}
@media(max-width:700px){.nick{margin:4px 0 8px}.nick span{font-size:13px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><span class="lamp" id="lamp">X光使用中</span><h1>X光室求生記</h1><p>醫事放射師專業倫理情境模擬</p></div>
  <div class="game">
    <div class="box gbox">
      <div class="goal" id="goal" hidden></div><div class="screen"><canvas id="cv"></canvas><button class="float" id="float" hidden></button><div class="toast" id="toast"></div></div>
      <div class="hint"><span>點地圖上的人或電話就會走過去處理</span><span><kbd>←↑↓→</kbd> 移動、<kbd>空白鍵</kbd> 互動、<kbd>1</kbd>–<kbd>4</kbd> 選選項</span></div>
    </div>
    <div class="side">
      <div class="box hud" id="hud"></div>
      <div class="box todo" id="todo"></div>
    </div>
    <div class="modal" id="modal" hidden></div>
    <div class="cover" id="cover"></div>
  </div>
</div>
<script>
{
/* ================= 基本資料 ================= */
const PR={au:'自主',nm:'不傷害',be:'行善',ju:'公平正義',ho:'誠信',co:'保密'};const PK=Object.keys(PR);
const pe=s=>{const o={};(s||'').split(' ').filter(Boolean).forEach(t=>{const m=t.match(/^([a-z]+)(-?\d)$/);if(m)o[m[1]]=+m[2]});return o};
const STAMP=['出事了','有風險','可以更好','漂亮'];
const EX={
 cxr:{n:'Chest PA',z:'胸部正面',det:'stand',gown:1},
 abs:{n:'Abdomen standing',z:'立位腹部',det:'stand',gown:1},
 kub:{n:'KUB',z:'腹部平躺',det:'table',gown:1},
 pel:{n:'Pelvis AP',z:'骨盆正面',det:'table',gown:1},
 ls:{n:'L-spine AP/Lat',z:'腰椎',det:'table',gown:1},
 cs:{n:'C-spine Lat',z:'頸椎側面',det:'stand',gown:1},
 sho:{n:'Shoulder AP/Y-view',z:'肩關節',det:'stand',gown:1},
 knee:{n:'Knee AP/Lat',z:'膝關節',det:'table',gown:0},
 wri:{n:'Wrist AP/Lat',z:'手腕',det:'table',gown:0},
 fa:{n:'Forearm AP/Lat',z:'前臂',det:'table',gown:0},
 hand:{n:'Hand PA/Obl',z:'手掌',det:'table',gown:0}};
const DET={stand:'立式攝影架（Standing bucky）',table:'檢查台（Table bucky）'};
const MOB={walk:'自行步入',wheel:'輪椅',bed:'推床'};
const HELP={senior:'老學長',boss:'單位主管'};

/* 外觀：h髮色 s膚色 c上衣 p褲 st髮型 g眼鏡 b鬍子 */
const L=(h,c,p,st,x={})=>({h,s:x.s||'#f1c9a5',c,p,st,g:x.g,b:x.b,kid:x.kid});
const LOOK={me:L('#2a2a2a','#1f8a9a','#1f8a9a','short'),nb:L('#5a3a26','#8fd18b','#8fd18b','short',{g:1}),
 nurse:L('#2a1a14','#f4a7c0','#f4a7c0','nurse'),senior:L('#9e9e9e','#34506b','#34506b','short',{g:1}),boss:L('#777','#e8e8e8','#3b3b45','bald',{g:1})};

/* ================= 班別 ================= */


/* ================= 病人與情境 ================= */
const PATS={
day:[
{n:'蔡伯伯',tag:'急診推床',hi:'少年仔，這張床比我家的還好睡。',hi2:'（伯伯閉著眼睛，偶爾咕噥兩聲）……嗯……',sx:'男',age:76,mob:'bed',ex:'cxr',lk:L('#ccc','#a7b8c9','#666','bald'),cs:null},
{n:'王大明',tag:'順便哥',hi:'我跟你說喔，我這個人最講求效率了！',sx:'男',age:58,mob:'walk',ex:'knee',lk:L('#555','#7a8c5a','#4a4a55','short',{b:1}),
 cs:{when:'pre',tags:[],sit:'他坐上檢查台後指著自己的腰。',say:'反正都來了，腰椎、肩膀、肺、順便那個牙齒也一起照一照啦！一次打包，我趕時間！',
 tip:'輻射防護的「正當化」：每一次曝光都必須有醫囑與臨床理由。',
 o:[['反正都來了，順手幫他照，報告再請醫師補單',0,'nm-2 ho-1',5,0,'主管看到工作清單多了一張沒醫囑的腰椎，眼神比 X 光還有穿透力。沒有醫囑的曝光就是不當照射。'],
    ['說明沒有醫囑不能照，請他回診時再跟醫師說',2,'nm1 ho1',-5,0,'規範正確，但他得白跑一趟。還能多做一步。'],

/* ================= 尋路 ================= */
function near(c,r,sol){if(!sol(c,r))return [c,r];for(let rad=1;rad<4;rad++)for(let dc=-rad;dc<=rad;dc++)for(let dr=-rad;dr<=rad;dr++){if(!sol(c+dc,r+dr))return [c+dc,r+dr]}return [c,r]}
function bfs(sx,sy,tx,ty,sol){
  [sx,sy]=near(Math.floor(sx),Math.floor(sy),sol);[tx,ty]=near(Math.floor(tx),Math.floor(ty),sol);
  const K=(c,r)=>r*40+c,prev=new Map([[K(sx,sy),null]]),Q=[[sx,sy]];
  while(Q.length){const [c,r]=Q.shift();if(c===tx&&r===ty)break;
    for(const [dc,dr] of [[1,0],[-1,0],[0,1],[0,-1]]){const n=[c+dc,r+dr];if(sol(n[0],n[1])||prev.has(K(...n)))continue;prev.set(K(...n),[c,r]);Q.push(n)}}
  if(!prev.has(K(tx,ty)))return [];
  const p=[];let cur=[tx,ty];while(cur){p.unshift({x:cur[0]+.5,y:cur[1]+.5});cur=prev.get(K(...cur))}return p.slice(1);
}
const goN=(e,to)=>{e.path=bfs(e.x,e.y,to.x,to.y,solN).concat([{x:to.x,y:to.y}])};
function step(e,t,sp,dt){const dx=t.x-e.x,dy=t.y-e.y,d=Math.hypot(dx,dy);if(d<.04){e.x=t.x;e.y=t.y;return true}const m=Math.min(d,sp*dt);e.x+=dx/d*m;e.y+=dy/d*m;if(Math.abs(dx)>.02)e.dir=dx>0?1:-1;e.mv=true;return false}
function follow(e,sp,dt){if(!e.path.length)return true;if(step(e,e.path[0],sp,dt))e.path.shift();return !e.path.length}
const free=(x,y)=>{const r=.26;return [[x-r,y-.1],[x+r,y-.1],[x-r,y+.35],[x+r,y+.35]].every(([a,b])=>!solP(Math.floor(a),Math.floor(b)))};

/* ================= 互動目標 ================= */
/* 每個目標：{k,label,pos,range,f} */
function targets(){
  const A=[];if(!G||G.dlg||G.shooting||G.push)return A;
  if(G.phone.ring)A.push({k:'ph',label:`接電話（${G.phone.d.n}）`,pos:CONSOLE,range:1.3,f:openPhone});
  if(G.it&&G.it.st==='wait')A.push({k:'it',label:`回應 ${G.it.d.n}`,pos:G.it,range:1.3,f:openIt});
  const p=G.cur;
  if(p&&p.st==='in'&&!p.told&&(G.phone.ring||(G.it&&G.it.st==='wait')))A.push({k:'tell',label:'先跟病人說：「不好意思，我處理一下馬上回來！」',pos:p,range:1.4,f:()=>{p.told=1;p.wait=0;apply({be:1},2);toast(`${p.n}：「好啦好啦，你去忙。」（滿意度 +2）`)}});
  if(p&&p.st==='in')A.push({k:'rc',label:`核對 ${p.n} 的身分`,pos:p,range:1.4,f:()=>receive(p)});
  for(const q of G.pats)if(q.st==='stranded'&&!q.path.length)A.push({k:'str'+q.id,label:`安撫 ${q.n}、聯絡傳送`,pos:q,range:1.5,f:()=>{ditch();queue({kind:'bed',d:STRANDED(q),onDone:(g,a)=>{if(a==='push'){noExam(q);q.st='leave';toast(`你把 ${q.n} 推回去了……攝影室暫時沒人顧`)}else{q.st='pickup';q.trT=a==='call'?8:18}}})}});
  if(p&&p.st==='waitOut')A.push({k:'pout',label:`把 ${p.n} 推出攝影室`,pos:p,range:1.5,f:()=>{p.st='pout';goN(p,{x:14.5,y:10.5});G.push={p,trail:[]};if(G.fam){G.fam.out=1;goN(G.fam,SP.exit)}}});
  if(!p){for(const q of G.pats)if(q.st==='seat')A.push(q.mob==='bed'?{k:'call'+q.id,label:`把 ${q.n} 的推床推進攝影室`,pos:q,range:1.5,f:()=>bedIn(q)}:{k:'call'+q.id,label:`叫號：請 ${q.n} 進來`,pos:q,range:1.4,f:()=>callIn(q)});
    const nx=G.pats.find(q=>q.st==='seat'&&q.mob!=='bed');if(nx)A.push({k:'door',label:`叫號：請 ${nx.n} 進來`,pos:SP.door,range:1.2,f:()=>callIn(nx),hide:1})}
  return A;
}
function nearest(){const me=G.me;let b=null,bd=1e9;for(const a of targets()){const d=dist(me,a.pos);if(d<=a.range&&d<bd){b=a;bd=d}}return b}
function goTo(a){if(!a)return;G.me.goal=a.k;G.me.path=bfs(G.me.x,G.me.y,a.pos.x,a.pos.y,solP)}
function doTarget(a){G.me.goal=null;G.me.path=[];a.f()}
function callIn(q){if(G.cur)return;G.cur=q;q.st='call';goN(q,SP.center);toast(q.mob==='bed'?`你推著 ${q.n} 進攝影室……`:`請 ${q.n} 進來……`);
  if(q.fam){G.fam={x:q.x+.6,y:q.y,path:[],dir:-1,lk:FAMLK,n:q.famN||'家屬'};goN(G.fam,{x:SP.center.x+1.1,y:SP.center.y+.2})}}
function bedIn(q){
  if(!q.alert&&!q.fam&&!q.forced){queue({kind:'bed',d:BEDHELP(q),onDone:(g,a)=>{if(a==='call'){q.st='waitHelp';q.helpT=12;toast('你打電話請護理師幫忙找人……')}else{q.forced=1;startPush(q)}}});return}
  startPush(q);
}
function startPush(q){if(G.cur){q.st='seat';return}callIn(q);G.push={p:q,trail:[]}}
function pushTick(){const P=G.push,p=P.p,me=G.me;P.trail.push({x:p.x,y:p.y});
  for(let i=P.trail.length-1;i>=0;i--){const t=P.trail[i];if(Math.hypot(t.x-p.x,t.y-p.y)>=.9){me.dir=p.x>t.x?1:-1;me.x=t.x;me.y=t.y;me.mv=true;break}}
  if(P.trail.length>400)P.trail.splice(0,200)}
function noExam(p,msg){p.st='leave';p.seat=null;if(p.onTable){p.onTable=false;p.x=SP.tableAdj.x;p.y=SP.tableAdj.y}goN(p,SP.exit);if(G.cur===p)G.cur=null;goN(G.nb,SP.nbHome);if(G.fam){G.fam.out=1;goN(G.fam,SP.exit)}if(msg)toast(msg)}
const FAMLK=L('#3a2a1a','#8aa0c0','#444','long'),APRON=L('#3a2a1a','#56636e','#56636e','long');

/* ================= 輸入 ================= */
addEventListener('keydown',e=>{
  if(!G||G.over)return;const k=e.key.toLowerCase();
  if(G.dlg){if(/^[1-4]$/.test(k)){const b=$('modal').querySelectorAll('[data-n]')[+k-1];if(b&&!b.disabled){b.click();e.preventDefault()}}return}
  if(k===' '||k==='enter'){const a=nearest();if(a){doTarget(a);e.preventDefault()}return}
  if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)){keys[k]=true;G.me.goal=null;e.preventDefault()}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
cv.addEventListener('pointerdown',e=>{
  if(!G||G.dlg||G.over||G.shooting||G.push)return;const b=cv.getBoundingClientRect();
  const x=(e.clientX-b.left)/b.width*COLS,y=(e.clientY-b.top)/b.height*ROWS,pt={x,y};
  let hit=null,hd=scale()<.8?1.5:.9;for(const a of targets()){if(a.hide)continue;const d=dist(pt,{x:a.pos.x,y:a.pos.y-.3});if(d<hd){hit=a;hd=d}}
  if(!hit&&G.phone.ring&&x<4.2&&y<2.6)hit=targets().find(a=>a.k==='ph');
  if(hit){if(dist(G.me,hit.pos)<=hit.range)doTarget(hit);else goTo(hit);return}
  G.me.goal=null;G.me.path=bfs(G.me.x,G.me.y,x,y,solP);
});
$('float').onclick=()=>{const a=nearest();if(a)doTarget(a)};
function toast(t,bad){const el=$('toast');el.textContent=t;el.className='toast show'+(bad?' bad':'');clearTimeout(toast.h);toast.h=setTimeout(()=>el.className='toast',2800)}

function apply(e,s,c,log){
  for(const p in e)if(p in G.sc)G.sc[p]=Math.max(0,Math.min(100,G.sc[p]+e[p]*7));
  G.sat=Math.max(0,Math.min(100,G.sat+(s||0)));if(c)G.comp++;if(log)G.log.push(log);
}

/* ================= 更新 ================= */
function update(dt){
  G.t+=dt;const me=G.me,tdt=G.dlg?0:dt;me.mv=false;
  if(G.shooting)shootTick(dt);
  else if(G.push)pushTick();
  else if(!G.dlg){
    const vx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0),vy=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);
    if(vx||vy){me.path=[];const l=Math.hypot(vx,vy),sp=4*dt,nx=me.x+vx/l*sp,ny=me.y+vy/l*sp;if(free(nx,me.y))me.x=nx;if(free(me.x,ny))me.y=ny;if(vx)me.dir=vx;me.mv=true}
    else follow(me,4,dt);
    if(me.goal){const a=targets().find(t=>t.k===me.goal);if(!a)me.goal=null;else if(dist(me,a.pos)<=a.range)doTarget(a)}
  }
  /* 病人到院：候診最多 2 位 */
  const waiting=G.pats.filter(p=>['arrive','seat','asking','waitHelp','seatX'].includes(p.st)).length;
  G.arrNext-=tdt;
  if(G.arrNext<=0&&waiting<3){const p=G.pats.find(q=>q.st==='off');if(p){p.st='arrive';G.arrNext=G.cfg.arr}}
  for(const p of G.pats){
    p.mv=false;
    if(p.st==='arrive'){if(!p.seat){const used=G.pats.filter(q=>q.seat&&q!==p&&['arrive','seat','asking','waitHelp','seatX'].includes(q.st)).map(q=>q.seatC);let c=11;while(used.includes(c))c+=2;p.seatC=c;p.seat={x:c+.5,y:11.3};goN(p,p.seat)}
      if(follow(p,2.4,dt)){p.st='seat';toast(`${p.n} 到候診區了`)}}
    if(p.st==='seat'){p.wait+=tdt;
      if(p.wait>ASK&&!p.complained&&!G.it&&p.mob!=='bed'){p.complained=true;G.it={x:p.x,y:p.y,path:[],st:'come',wait:0,d:{...WAIT,n:p.n,lk:p.lk},pat:p};p.st='asking';goN(G.it,SP.corr);toast(`${p.n} 從候診椅站起來了……`)}
      else if(p.wait>QUIT&&p.mob==='bed'){if(!p.boom){p.boom=1;apply({be:-1},-4);toast(`${p.n} 在推床上等到火山爆發了！（但傳送人員已經走了，他哪裡也去不了）`,1)}}
      else if(p.wait>QUIT){apply({be:-1},-8,1,{cat:'候診',n:p.n,g:0,x:'等太久憤而離席'});G.quit=(G.quit||0)+1;EV('back',p.n);noExam(p);toast(p.mob==='bed'?`急診護理師把 ${p.n} 推回去了，丟下一句：「你們很忙齁？」（投訴 +1）`:`${p.n} 等了 40 秒，大喊「什麼爛醫院！」憤而離席（投訴 +1）`,1)}}
    if(p.st==='waitHelp'){p.helpT-=tdt;if(p.helpT<=0){if(Math.random()<.65){p.fam=1;p.famN='家屬';p.st='seat';p.wait=0;toast(`護理師回電：${p.n} 的家屬趕到了！可以推進來了`)}else{p.st='seatX';queue({kind:'bed',d:BEDNO(p),onDone:(g,a)=>{if(a==='force'){p.forced=1;p.st='seat';startPush(p)}else{EV('back',p.n);noExam(p,`${p.n} 先送回去了`)}}})}}}
    if(p.st==='lab'){if(follow(p,2.4,dt)){p.labT-=tdt;if(p.labT<=0){p.st='arrive';p.x=SP.exit.x;p.y=SP.exit.y;p.wait=0;p.complained=false;toast(`${p.n} 驗完孕回來了`)}}}
    if(p.st==='pout'){if(follow(p,1.8,dt)){G.push=null;G.cur=null;
      if(Math.random()<.45){p.st='stranded';p.wait=0;p.boom=0;goN(p,{x:17.5,y:10.5});toast(`${p.n} 推出去了……但傳送人員好像忘記來接了！`,1)}
      else{p.st='leave';goN(p,SP.exit);toast(`${p.n} 推出去了，傳送人員接走了`)}}}
    if(p.st==='stranded'){follow(p,1.8,dt);p.wait+=tdt;if(p.wait>QUIT&&!p.boom){p.boom=1;apply({be:-1},-6);toast(`${p.n} 在走廊等到火山爆發了！`,1)}}
    if(p.st==='pickup'){p.trT-=tdt;if(p.trT<=0){p.st='leave';goN(p,SP.exit);toast(`傳送人員終於來了，把 ${p.n} 接走了`)}}
    if(p.st==='exam'&&p.path.length){if(follow(p,p.mob==='walk'?2.4:1.8,dt)&&p.det==='table')p.onTable=true}
    if(p.st==='in'&&!p.told){p.wait+=tdt;if(p.wait>40&&!p.mad){p.mad=1;apply({be:-1},-8,0,{cat:'病人',n:p.n,g:0,x:'在攝影室裡乾等'});toast(`${p.n} 在攝影室裡站到腳痠，開始碎念了（滿意度 −8）`,1)}}
    if(p.st==='call'||p.st==='leave'){const sp=p.mob==='walk'?2.4:1.8;
      if(follow(p,sp,dt)){if(p.st==='call'){if(G.push&&G.push.p===p)G.push=null;p.st='in';p.wait=0;toast(`${p.n} 進來了，走過去核對身分`)}else{p.st='done';G.served++}}}
  }
  const it=G.it;
  if(it){
    if(it.st==='come'){if(follow(it,2.6,dt)){if(it.d.barge){goN(it,{x:10.5,y:7.5});it.st='barge'}else{it.st='wait';toast(`門口：${it.d.n} 在等你回應`)}}}
    else if(it.st==='barge'){if(follow(it,2.6,dt)){it.st='wait';toast('有人推門闖進攝影室！',1)}}
    else if(it.st==='wait'){it.wait+=tdt;if(it.wait>ITWAIT){apply({be:-1},-6,0,{cat:'走廊',n:it.d.n,g:0,x:'沒人理'});G.ignored++;toast(`${it.d.n} 等不到人，氣呼呼地走了（滿意度 −6）`,1);itLeave()}}
    else if(it.st==='leave'){if(follow(it,2.6,dt)){if(it.pat){it.pat.st='seat';it.pat.x=it.pat.seat.x;it.pat.y=it.pat.seat.y}G.it=null}}
  } else if(G.served<G.pats.length){G.itNext-=tdt;if(G.itNext<=0){G.itNext=rnd(G.cfg.it);spawnIt()}}
  const ph=G.phone;
  if(ph.ring){ph.t+=tdt;if(ph.t>(ph.boss?28:RING)){ph.ring=false;G.missCall++;ph.next=rnd(G.cfg.ph);
      if(ph.boss){ph.boss=false;G.boss={x:SP.exit.x,y:10.5,path:[],st:'come',re:0,dir:-1};apply({},-5,0,{cat:'主管',n:'單位主管',g:0,x:'連主管的電話都沒接'});toast(['主管放下電話，從辦公室走過來了……','主管：「……」（嘟——）他開車過來了。','主管：「……」（嘟——）你聽到遠方傳來藍白拖狂奔的聲音。'][G.cfg.lv],1)}
      else{apply({be:-1},-5,1,{cat:'電話',n:ph.d.n,g:0,x:'漏接被投訴'});toast(`漏接電話被投訴：${ph.d.miss}`,1);G.bossPending=4}}}
  else if(G.bossPending>0){if(!G.dlg||G.dlg.kind!=='ph'){G.bossPending-=tdt;if(G.bossPending<=0){G.bossPending=0;ph.d=BOSSPH(G.cfg.lv);ph.boss=true;ph.ring=true;ph.t=0;toast('電話又響了……來電顯示：單位主管',1)}}}
  else if(G.served<G.pats.length&&!G.boss&&!(G.dlg&&G.dlg.kind==='ph')){ph.next-=tdt;if(ph.next<=0){const pool=PHONES.filter(p=>p.s.includes(G.k)&&!G.usedPh.includes(p));if(pool.length){ph.d=pool[Math.random()*pool.length|0];G.usedPh.push(ph.d);ph.ring=true;ph.t=0;toast('操作室電話響了！')}else ph.next=1e9}}
  G.gag=(G.gag??14)-tdt;if(G.gag<=0&&!G.dlg){G.gag=22+Math.random()*14;toast(GAGS[Math.random()*GAGS.length|0])}

  ${G.bossMood<0||G.log.some(l=>l.cat==='主管')?`<p class="small">主管留言：「${['你都資深了，這種小事自己處理就好。','下次我吃飯的時候，拜託讓我好好吃完。','我明天要請假補眠。你知道為什麼。'][G.cfg.lv]}」</p>`:''}
  <ul class="log">${dec.map(l=>`<li><span class="g${l.g}">${STAMP[l.g]}</span><span>【${l.cat}】${l.n}${l.x?'（'+l.x+'）':''}</span></li>`).join('')}</ul>
  <div class="row"><button class="btn" id="re">再值一次${G.cfg.n}</button><button class="btn ghost" id="mn">換班別</button></div>
  <p class="small" style="margin-top:12px">情境為教學用簡化版本，實際處置請依醫院規範與最新法規。</p></div>`;
  const k=G.k;$('re').onclick=()=>start(k);$('mn').onclick=menu;$('cover').scrollTop=0;
  if(SCORE_API){const rec={name:NICK,shift:k,score:pct,decision,minus,handover:hand,comp:G.comp,quit:G.quit||0,miss:G.missCall,ver:VER};
    postScore(rec).then(()=>{$('upl').textContent='✓ 成績已上傳';$('upl').classList.add('ok')}).catch(()=>{$('upl').textContent='成績上傳失敗（網路或設定問題），請截圖這個畫面給老師。'}).finally(()=>fillBoard($('lbx')))}
}
menu();

}
</script>
